name: Flutter Build & Versioning

on:
  push:
    branches: [main, testing, production]
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # CHECKOUT WITH TAG SUPPORT
      # ----------------------------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 🔥 REQUIRED for tags

      - name: Fetch all tags
        run: git fetch --tags

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.8

      # ----------------------------
      # VERSION LOGIC
      # ----------------------------
      - name: Determine and Bump Version
        id: version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch --tags

          # Get latest tag or default
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            CURRENT_TAG=$(git describe --tags --abbrev=0)
          else
            CURRENT_TAG="v0.1.0"
          fi

          VERSION=${CURRENT_TAG#v}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          if [ "${GITHUB_REF}" = "refs/heads/testing" ]; then
            PATCH=$((PATCH + 1))
          elif [ "${GITHUB_REF}" = "refs/heads/production" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            # No bump for main/dev
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT
            exit 0
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_TAG="v$NEW_VERSION"

          echo "Checking if tag exists: $NEW_TAG"

          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists. Skipping tag creation."
          else
            echo "Creating tag: $NEW_TAG"
            git tag $NEW_TAG
            git push origin $NEW_TAG
          fi

          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

          echo "Using version: $NEW_VERSION+${GITHUB_RUN_NUMBER}"

      - name: Flutter pub get
        run: flutter pub get

      # ----------------------------
      # ANDROID SIGNING
      # ----------------------------
      - name: Decode Android keystore
        if: github.ref != 'refs/heads/main'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks

      - name: Create key.properties
        if: github.ref != 'refs/heads/main'
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # ----------------------------
      # DEV BUILD (main branch)
      # ----------------------------
      - name: Dev Build
        if: github.ref == 'refs/heads/main'
        run: |
          flutter build apk \
            --debug \
            --build-name=0.0.0 \
            --build-number=${{ steps.version.outputs.BUILD_NUMBER }}

      # ----------------------------
      # TESTING BUILD
      # ----------------------------
      - name: QA Build
        if: github.ref == 'refs/heads/testing'
        run: |
          flutter build appbundle \
            --release \
            --build-name=${{ steps.version.outputs.VERSION }} \
            --build-number=${{ steps.version.outputs.BUILD_NUMBER }}

      # ----------------------------
      # PRODUCTION BUILD
      # ----------------------------
      - name: Production Build
        if: github.ref == 'refs/heads/production'
        run: |
          flutter build appbundle \
            --release \
            --build-name=${{ steps.version.outputs.VERSION }} \
            --build-number=${{ steps.version.outputs.BUILD_NUMBER }}

      # ----------------------------
      # UPLOAD ARTIFACTS
      # ----------------------------
      - name: Upload Dev Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dev-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload QA Artifact
        if: github.ref == 'refs/heads/testing'
        uses: actions/upload-artifact@v4
        with:
          name: testing-aab-${{steps.version.outputs.VERSION}}
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Production Artifact
        if: github.ref == 'refs/heads/production'
        uses: actions/upload-artifact@v4
        with:
          name: production-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # ----------------------------
      # PLAY STORE DEPLOY (Testing)
      # ----------------------------
      - name: Create Google Play service account file
        if: github.ref == 'refs/heads/testing'
        run: |
          echo '${{ secrets.PLAY_STORE_JSON_KEY }}' > service-account.json
          # Verify service account file is valid JSON
          if ! jq -e . service-account.json > /dev/null 2>&1; then
            echo "❌ ERROR: PLAY_STORE_JSON_KEY is not valid JSON"
            exit 1
          fi
          echo "✅ Service account JSON is valid"
          echo "Service account email: $(jq -r .client_email service-account.json)"

      - name: Deploy to Play Store (Internal Testing)
        if: github.ref == 'refs/heads/testing'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service-account.json
          packageName: com.techhive.quickbill
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
          whatsNewDirectory: distribution/whatsnew
