name: quickbill
description: "A quick billing app for grocery stores with barcode scanning."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.2
  
  # Google Sign In
  google_sign_in: ^6.2.2
  
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  
  # Barcode Scanning
  mobile_scanner: ^5.2.3
  
  # QR Code Generation
  qr_flutter: ^4.1.0
  
  # UI
  cached_network_image: ^3.4.1
  
  # Charts & Analytics
  fl_chart: ^0.69.0
  
  # Excel Export
  excel: ^4.0.6
  
  # Printing & PDF
  printing: ^5.13.3
  pdf: ^3.11.1
  
  # File System
  path_provider: ^2.1.4
  
  # Share Files
  share_plus: ^10.1.2
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  rename: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
